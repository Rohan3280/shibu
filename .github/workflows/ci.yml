name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.5"
  JAVA_VERSION: "17"

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      # The deck order must be identical in Dart and Kotlin, or the in-app
      # preview will disagree with the lock screen. The Dart side is pinned to
      # goldens in test/deck_order_test.dart; this proves the JVM still
      # produces them.
      - name: Verify cross-language deck order
        run: |
          java tool/verify_deck_order/VerifyDeckOrder.java | tee order.txt
          grep -q "seed 20240623, 0..9  -> \[0, 9, 2, 4, 3, 6, 8, 1, 5, 7\]" order.txt

  build:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Unsigned here: this job only proves the app still builds. Signed
      # artifacts are produced by release.yml.
      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shibu-debug-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
