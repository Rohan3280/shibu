name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.0.0"
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.5"
  JAVA_VERSION: "17"

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Test
        run: flutter test

      # Signing is optional. With the four secrets set, releases are signed with
      # your upload key and are upgradable in place. Without them, the build
      # falls back to the debug key — still installable, but users cannot
      # upgrade from a differently signed build.
      # The `secrets` context is not available in a step-level `if:`, so the
      # presence check happens inside the script instead.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No signing secrets configured; falling back to the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Name the artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          OUT=build/app/outputs/flutter-apk
          cp "$OUT/app-arm64-v8a-release.apk"   "dist/shibu-$VERSION-arm64.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist/shibu-$VERSION-arm32.apk"
          cp "$OUT/app-x86_64-release.apk"      "dist/shibu-$VERSION-x86_64.apk"
          cp "$OUT/app-release.apk"             "dist/shibu-$VERSION-universal.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Extract release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Pull the section for this version out of CHANGELOG.md, falling back
          # to a generic line if the heading is not there yet.
          NOTES=$(awk -v v="## [$VERSION]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/  { exit }
            found              { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          {
            echo "body<<SHIBU_EOF"
            echo "$NOTES"
            echo
            echo "---"
            echo
            echo "**Which APK?** \`arm64\` for any phone from the last several years."
            echo "\`universal\` works everywhere including emulators, at a larger size."
            echo
            echo "Requires Android 7.0 (API 24) or newer. Shibu works fully offline."
            echo "SHIBU_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Shibu ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
